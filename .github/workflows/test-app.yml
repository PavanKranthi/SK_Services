name: Test App (cloud)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/test-app.yml"

jobs:
  robolectric-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Offline mode: UI tests use local Room, no live Railway API required.
      - name: Write .env
        run: |
          echo "API_BASE_URL=DISABLED" >> .env
          echo "GEMINI_API_KEY=unused" >> .env

      - name: Run Robolectric UI tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon
