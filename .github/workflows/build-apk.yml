name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Hosted API URL (e.g. https://your-app.up.railway.app)"
        required: true
        type: string

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Write .env for API URL
        run: |
          printf 'API_BASE_URL=%s\n' "${{ inputs.api_base_url }}" >> .env
          echo "GEMINI_API_KEY=unused" >> .env
          cat .env

      - name: Write google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add repo secret GOOGLE_SERVICES_JSON (paste app/google-services.json contents)"
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --no-configuration-cache -x test
        env:
          GRADLE_OPTS: "-Dorg.gradle.configuration-cache=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sk-services-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
